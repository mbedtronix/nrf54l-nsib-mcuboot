SB_CONFIG_SECURE_BOOT_APPCORE=y
SB_CONFIG_SECURE_BOOT_SIGNING_KEY_FILE="\${APPLICATION_CONFIG_DIR}/keys/ed25519_2_private.pem"

SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="\${APPLICATION_CONFIG_DIR}/keys/ed25519_2_private.pem"

# ERROR: This wont work, MCUBoot has to have 2 slots
# SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y

# key provisioning needs to be done for the first flash i assume, since b0 fails validating keys if this is not enabled on first flash
SB_CONFIG_SECURE_BOOT_GENERATE_DEFAULT_KMU_KEYFILE=y
# without provisioning the key(s), b0 wont boot into mcuboot at all. if the key(s) is/are changed, they need to be reprovisioned. if i remove the key(s) from the 2 commands above and try to flash that it will also fail booting to mcuboot, which is kinda expected.

# Just for future reference, it might be needed:
# https://nrfconnectdocs.nordicsemi.com/ncs/2.9.2/nrf/app_dev/device_guides/nrf54l/kmu_provision.html#ug-nrf54l-developing-provision-kmu
# KMU support in its configuration needs to be enabled by setting the SB_CONFIG_MCUBOOT_SIGNATURE_USING_KMU sysbuild Kconfig option. Otherwise, MCUboot will fallback to the compiled in key.

