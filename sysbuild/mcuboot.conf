# https://academy.nordicsemi.com/courses/nrf-connect-sdk-intermediate/lessons/lesson-9-bootloaders-and-dfu-fota/topic/exercise-1-dfu-over-uart/
# check the comments for those configs in the link above
CONFIG_BOOT_MAX_IMG_SECTORS=256

# logging
CONFIG_LOG=y
CONFIG_MCUBOOT_LOG_LEVEL_DBG=y

CONFIG_UART_CONSOLE=y

# CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
### Ensure Zephyr logging changes don't use more resources
CONFIG_LOG_DEFAULT_LEVEL=0
### Decrease footprint by ~4 KB in comparison to CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_NANO=y


# Bump this value up on every new MCUBoot build that you want to upload
# B0 will only try to verify and boot the app if the version is higher than the one that is currently running
CONFIG_FW_INFO_FIRMWARE_VERSION=1
